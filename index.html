<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serial Number Lookup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --ink: #14212b;
            --ink-soft: #3d4f5c;
            --paper: #e7eef2;
            --surface: #f7fafb;
            --line: #b7c5cf;
            --line-strong: #8a9eac;
            --accent: #c45d1a;
            --accent-deep: #9a4510;
            --teal: #1a6b5c;
            --teal-soft: #d7ebe5;
            --danger: #b42318;
            --danger-soft: #f8e4e1;
            --ok: #1a6b5c;
            --code-bg: #102028;
            --code-fg: #c8e6d8;
            --radius: 4px;
            --font: "Bricolage Grotesque", sans-serif;
            --mono: "IBM Plex Mono", ui-monospace, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            color: var(--ink);
            background-color: var(--paper);
            background-image:
                linear-gradient(rgba(20, 33, 43, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(20, 33, 43, 0.04) 1px, transparent 1px),
                radial-gradient(ellipse 80% 50% at 10% -10%, rgba(196, 93, 26, 0.12), transparent 55%),
                radial-gradient(ellipse 60% 40% at 100% 0%, rgba(26, 107, 92, 0.1), transparent 50%);
            background-size: 28px 28px, 28px 28px, auto, auto;
            min-height: 100vh;
            padding: 28px 20px 48px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .shell {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            animation: riseIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .masthead {
            display: grid;
            gap: 18px;
            margin-bottom: 28px;
            padding-bottom: 22px;
            border-bottom: 2px solid var(--ink);
            animation: riseIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
        }

        .brand {
            font-size: clamp(2.4rem, 6vw, 3.6rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 0.95;
            color: var(--ink);
        }

        .brand span {
            color: var(--accent);
        }

        .masthead-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px 22px;
            color: var(--ink-soft);
            font-size: 0.98rem;
        }

        .masthead-meta p {
            max-width: 36ch;
            line-height: 1.45;
        }

        .stat {
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
            font-family: var(--mono);
            font-size: 0.85rem;
            padding: 6px 10px;
            border: 1px solid var(--line);
            background: var(--surface);
        }

        .stat strong {
            font-size: 1.05rem;
            color: var(--ink);
            font-weight: 500;
        }

        .workspace {
            display: grid;
            gap: 18px;
            animation: riseIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .field-label {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .field-hint {
            font-size: 0.82rem;
            color: var(--ink-soft);
        }

        .textarea,
        .generator-input {
            width: 100%;
            padding: 14px 14px;
            border: 1.5px solid var(--line-strong);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--ink);
            font-family: var(--mono);
            font-size: 0.92rem;
            line-height: 1.5;
            resize: vertical;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .textarea {
            min-height: 140px;
        }

        .textarea:focus,
        .generator-input:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            appearance: none;
            border: 1.5px solid transparent;
            border-radius: var(--radius);
            padding: 11px 16px;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: var(--accent-deep);
            border-color: var(--accent-deep);
        }

        .btn-secondary {
            background: var(--teal);
            color: #fff;
            border-color: var(--teal);
        }

        .btn-secondary:hover {
            background: #145447;
            border-color: #145447;
        }

        .btn-ghost {
            background: transparent;
            color: var(--ink);
            border-color: var(--line-strong);
        }

        .btn-ghost:hover {
            background: #fff;
            border-color: var(--ink);
        }

        .results {
            margin-top: 8px;
            border: 1.5px solid var(--ink);
            background: #fff;
            max-height: 58vh;
            overflow: auto;
            animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--mono);
            font-size: 0.86rem;
        }

        .table th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--ink);
            color: #f3f7f9;
            text-align: left;
            padding: 12px 14px;
            font-family: var(--font);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
        }

        .table th:hover {
            background: #1d2e3b;
        }

        .table td {
            padding: 11px 14px;
            border-bottom: 1px solid #d9e2e8;
            vertical-align: top;
        }

        .table tbody tr:hover {
            background: #f0f6f4;
        }

        .sort-icon {
            margin-left: 6px;
            opacity: 0.45;
            font-weight: 500;
        }

        .sort-icon.active {
            opacity: 1;
            color: #f0b27a;
        }

        .status-found {
            color: var(--ok);
            font-weight: 500;
        }

        .status-not-found {
            color: var(--danger);
            font-weight: 500;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(12, 20, 28, 0.72);
            animation: fadeIn 0.2s ease;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(95vw, 1100px);
            max-height: 90vh;
            background: var(--surface);
            border: 2px solid var(--ink);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: modalIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-content.narrow {
            width: min(95vw, 860px);
        }

        .modal-content.notice {
            width: min(92vw, 420px);
        }

        .notice-message {
            margin: 0 0 18px;
            color: var(--ink-soft);
            font-size: 0.98rem;
            line-height: 1.5;
        }

        .notice-actions {
            display: flex;
            justify-content: flex-end;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: var(--ink);
            color: #f4f8fa;
            border-bottom: 2px solid var(--accent);
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: transparent;
            color: #fff;
            font-size: 1.4rem;
            line-height: 1;
            display: grid;
            place-items: center;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #fff;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }

        .modal-body .results {
            margin-top: 0;
            max-height: calc(90vh - 120px);
        }

        .generator-grid {
            display: grid;
            gap: 16px;
        }

        .generator-output {
            min-height: 180px;
            background: var(--code-bg);
            color: var(--code-fg);
            border-color: #243846;
        }

        .generator-output:focus {
            background: var(--code-bg);
            border-color: var(--accent);
        }

        .generator-message {
            min-height: 22px;
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .generator-message.success {
            color: var(--ok);
        }

        .generator-message.error {
            color: var(--danger);
        }

        .generator-conflicts {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            background: var(--danger-soft);
            border: 1px solid #e8b4ad;
            color: #7a1f18;
            font-size: 0.84rem;
            max-height: 160px;
            overflow-y: auto;
        }

        .generator-conflicts.show {
            display: block;
        }

        .generator-conflicts ul {
            margin: 8px 0 0 18px;
        }

        .generator-conflicts code {
            font-family: var(--mono);
            font-size: 0.8rem;
        }

        .loading {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(12, 20, 28, 0.78);
            place-items: center;
            text-align: center;
        }

        .loading.show {
            display: grid;
        }

        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .loading-text {
            color: #edf3f6;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translate(-50%, calc(-50% + 12px));
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        @media (max-width: 720px) {
            body {
                padding: 18px 14px 36px;
            }

            .brand {
                font-size: 2.2rem;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .modal-body {
                padding: 14px;
            }

            .table th,
            .table td {
                padding: 10px 8px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="masthead" style="display: flex; align-items: center; justify-content: space-between;">
            <h1 class="brand" style="margin: 0;">Serial<span>.</span>Lookup</h1>
            <div class="masthead-meta">
                <div class="stat">
                    <strong id="entryCount">0</strong>
                    <span>serials indexed</span>
                </div>
            </div>
        </header>

        <main class="workspace">
            <div class="field">
                <label class="field-label" for="serialInput">Serial numbers</label>
                <textarea
                    id="serialInput"
                    class="textarea"
                    placeholder="One per line&#10;1240814267&#10;821025262"
                ></textarea>
            </div>

            <div class="actions">
                <button class="btn btn-primary" type="button" onclick="processSerialNumbers()">Lookup</button>
                <button class="btn btn-secondary" type="button" onclick="exportToCSV()">Export CSV</button>
                <button class="btn btn-secondary" type="button" onclick="exportToExcel()">Export Excel</button>
                <button class="btn btn-ghost" type="button" onclick="openDatabaseModal()">Database</button>
                <button class="btn btn-ghost" type="button" onclick="openGeneratorModal()">JSON Generator</button>
            </div>

            <div class="results">
                <table class="table" id="resultTable">
                    <thead id="resultTableHead" style="display: none;">
                        <tr>
                            <th onclick="sortResultTable(0)">
                                Serial Number
                                <span class="sort-icon">↕</span>
                            </th>
                            <th onclick="sortResultTable(1)">
                                Product Number
                                <span class="sort-icon">↕</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="databaseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Database</h2>
                <button class="modal-close" type="button" onclick="closeDatabaseModal()" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <div class="results">
                    <table class="table" id="databaseTable">
                        <thead>
                            <tr>
                                <th onclick="sortDatabaseTable(0)">
                                    Serial Number Range
                                    <span class="sort-icon">↕</span>
                                </th>
                                <th onclick="sortDatabaseTable(1)">
                                    Product Number
                                    <span class="sort-icon">↕</span>
                                </th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="generatorModal" class="modal">
        <div class="modal-content narrow">
            <div class="modal-header">
                <h2 class="modal-title">JSON Entry Generator</h2>
                <button class="modal-close" type="button" onclick="closeGeneratorModal()" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <div class="generator-grid">
                    <div class="field">
                        <label class="field-label" for="generatorProductNumber">Product number</label>
                        <input
                            id="generatorProductNumber"
                            class="generator-input"
                            type="text"
                            placeholder="A80-00L-RD6-01AU"
                        >
                    </div>

                    <div class="field">
                        <label class="field-label" for="generatorSerialRanges">Serial numbers and ranges</label>
                        <textarea
                            id="generatorSerialRanges"
                            class="textarea"
                            placeholder="1240814267-1240817016&#10;1240777150, 1240778587-1240778601"
                        ></textarea>
                    </div>

                    <div class="actions">
                        <button class="btn btn-primary" type="button" onclick="generateJsonEntries()">Generate</button>
                        <button class="btn btn-ghost" type="button" onclick="copyGeneratedJson()">Copy</button>
                        <button class="btn btn-secondary" type="button" onclick="downloadGeneratedJson()">Download</button>
                        <button class="btn btn-ghost" type="button" onclick="clearJsonGenerator()">Clear</button>
                    </div>

                    <div class="field">
                        <label class="field-label" for="generatedJson">Generated JSON</label>
                        <textarea
                            id="generatedJson"
                            class="textarea generator-output"
                            readonly
                            placeholder="Output appears here…"
                        ></textarea>
                        <div id="generatorMessage" class="generator-message" role="status"></div>
                        <div id="generatorConflicts" class="generator-conflicts"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="noticeModal" class="modal">
        <div class="modal-content notice">
            <div class="modal-header">
                <h2 class="modal-title" id="noticeTitle">Notice</h2>
                <button class="modal-close" type="button" onclick="closeNoticeModal()" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <p class="notice-message" id="noticeMessage"></p>
                <div class="notice-actions">
                    <button class="btn btn-primary" type="button" onclick="closeNoticeModal()">OK</button>
                </div>
            </div>
        </div>
    </div>

    <div id="loading" class="loading">
        <div>
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Loading...</div>
        </div>
    </div>

    <script>
        let serialMapping = {};
        let currentResultSort = { column: -1, ascending: true };
        let currentDatabaseSort = { column: 0, ascending: true };

        function showLoading(text = 'Loading...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }

        async function fetchSerialData() {
            showLoading('Loading serial database...');
            try {
                const response = await fetch('https://raw.githubusercontent.com/mgiatrakis/serialNumberLookUp/refs/heads/main/product_numbers.json');
                serialMapping = await response.json();

                let totalEntries = 0;
                for (const key in serialMapping) {
                    if (key.includes('-')) {
                        const parts = key.split('-');
                        const start = parseInt(parts[0]);
                        const end = parseInt(parts[1]);

                        if (!isNaN(start) && !isNaN(end) && end >= start) {
                            totalEntries += end - start + 1;
                        }
                    } else {
                        const num = parseInt(key);
                        if (!isNaN(num)) {
                            totalEntries += 1;
                        }
                    }
                }

                if (totalEntries === 0 || isNaN(totalEntries)) {
                    totalEntries = Object.keys(serialMapping).length;
                }

                animateNumber(totalEntries);
            } catch (error) {
                console.error("Error fetching JSON:", error);
                document.getElementById('entryCount').textContent = 'Error';
            } finally {
                hideLoading();
            }
        }

        function animateNumber(target) {
            const element = document.getElementById('entryCount');

            if (isNaN(target) || target <= 0) {
                element.textContent = 'N/A';
                return;
            }

            let current = 0;
            const increment = Math.max(1, Math.floor(target / 50));
            const timer = setInterval(() => {
                current += increment;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                element.textContent = Math.floor(current).toLocaleString();
            }, 30);
        }

        function normalizeSerialForLookup(serialNumber) {
            const trimmedSerial = serialNumber.trim();

            if (trimmedSerial.startsWith('82')) {
                return '0' + trimmedSerial;
            }

            return trimmedSerial;
        }

        function findProduct(serialNumber) {
            const trimmedSerial = normalizeSerialForLookup(serialNumber);

            if (serialMapping.hasOwnProperty(trimmedSerial)) {
                return serialMapping[trimmedSerial];
            }

            const numericSerial = parseInt(trimmedSerial);
            const isNumeric = !isNaN(numericSerial) && trimmedSerial === numericSerial.toString();

            for (const key in serialMapping) {
                if (key.includes('-')) {
                    const [startStr, endStr] = key.split('-');

                    const startNum = parseInt(startStr);
                    const endNum = parseInt(endStr);
                    const isNumericRange = !isNaN(startNum) && !isNaN(endNum) &&
                                          startStr === startNum.toString() &&
                                          endStr === endNum.toString();

                    if (isNumericRange && isNumeric) {
                        if (numericSerial >= startNum && numericSerial <= endNum) {
                            return serialMapping[key];
                        }
                    } else {
                        const serialMatch = trimmedSerial.match(/^(\d+)([A-Za-z]+)(\d+)$/);
                        const startMatch = startStr.match(/^(\d+)([A-Za-z]+)(\d+)$/);
                        const endMatch = endStr.match(/^(\d+)([A-Za-z]+)(\d+)$/);

                        if (serialMatch && startMatch && endMatch) {
                            if (serialMatch[1] === startMatch[1] &&
                                serialMatch[2] === startMatch[2] &&
                                serialMatch[2] === endMatch[2]) {
                                const serialSuffix = parseInt(serialMatch[3]);
                                const startSuffix = parseInt(startMatch[3]);
                                const endSuffix = parseInt(endMatch[3]);

                                if (!isNaN(serialSuffix) && !isNaN(startSuffix) && !isNaN(endSuffix) &&
                                    serialSuffix >= startSuffix && serialSuffix <= endSuffix) {
                                    return serialMapping[key];
                                }
                            }
                        } else {
                            if (trimmedSerial >= startStr && trimmedSerial <= endStr) {
                                return serialMapping[key];
                            }
                        }
                    }
                } else {
                    if (isNumeric) {
                        const keyNum = parseInt(key);
                        if (!isNaN(keyNum) && key === keyNum.toString() && numericSerial === keyNum) {
                            return serialMapping[key];
                        }
                    }
                }
            }
            return "Not Found";
        }

        async function processSerialNumbers() {
            const input = document.getElementById('serialInput').value;
            const serialNumbers = input.split('\n').map(s => s.trim()).filter(s => s);

            if (serialNumbers.length === 0) {
                showNoticeModal('Please enter at least one serial number.');
                return;
            }

            showLoading(`Processing ${serialNumbers.length} serial numbers...`);

            const tableBody = document.getElementById('resultTable').querySelector('tbody');
            tableBody.innerHTML = "";

            for (let i = 0; i < serialNumbers.length; i++) {
                const originalSerial = serialNumbers[i];
                const serial = normalizeSerialForLookup(originalSerial);
                const product = findProduct(serial);
                const statusClass = product === "Not Found" ? "status-not-found" : "status-found";
                const displaySerial = serial !== originalSerial
                    ? `${originalSerial} → ${serial}`
                    : serial;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${displaySerial}</td>
                    <td class="${statusClass}">${product}</td>
                `;
                tableBody.appendChild(row);

                if (i % 100 === 0 && i > 0) {
                    await new Promise(resolve => setTimeout(resolve, 10));
                }
            }

            hideLoading();
        }

        function exportToCSV() {
            const rows = document.querySelectorAll('#resultTable tbody tr');
            if (rows.length === 0) {
                showNoticeModal('No data to export. Please perform a lookup first.');
                return;
            }

            let csvContent = "Serial Number,Product Number\n";
            rows.forEach(row => {
                const cols = row.querySelectorAll('td');
                const serial = cols[0].innerText.replace(/"/g, '""');
                const product = cols[1].innerText.replace(/"/g, '""');
                csvContent += `"${serial}","${product}"\n`;
            });

            downloadFile(csvContent, 'serial_numbers.csv', 'text/csv');
        }

        function exportToExcel() {
            const rows = document.querySelectorAll('#resultTable tbody tr');
            if (rows.length === 0) {
                showNoticeModal('No data to export. Please perform a lookup first.');
                return;
            }

            const data = [['Serial Number', 'Product Number']];
            rows.forEach(row => {
                const cols = row.querySelectorAll('td');
                data.push([cols[0].innerText, cols[1].innerText]);
            });

            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Serial Numbers");
            XLSX.writeFile(wb, "serial_numbers.xlsx");
        }

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function openDatabaseModal() {
            document.getElementById('databaseModal').style.display = 'block';
            populateDatabaseTable();
        }

        function closeDatabaseModal() {
            document.getElementById('databaseModal').style.display = 'none';
        }

        function openGeneratorModal() {
            document.getElementById('generatorModal').style.display = 'block';
        }

        function closeGeneratorModal() {
            document.getElementById('generatorModal').style.display = 'none';
        }

        function showNoticeModal(message, title = 'Notice') {
            document.getElementById('noticeTitle').textContent = title;
            document.getElementById('noticeMessage').textContent = message;
            document.getElementById('noticeModal').style.display = 'block';
        }

        function closeNoticeModal() {
            document.getElementById('noticeModal').style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('databaseModal')) {
                closeDatabaseModal();
            }
            if (event.target === document.getElementById('generatorModal')) {
                closeGeneratorModal();
            }
            if (event.target === document.getElementById('noticeModal')) {
                closeNoticeModal();
            }
        };

        function populateDatabaseTable() {
            const tableBody = document.getElementById('databaseTable').querySelector('tbody');
            tableBody.innerHTML = "";

            const entries = Object.entries(serialMapping).map(([range, product]) => ({ range, product }));

            entries.sort((a, b) => {
                const [startA] = a.range.split('-').map(Number);
                const [startB] = b.range.split('-').map(Number);
                return startA - startB;
            });

            entries.forEach(entry => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${entry.range}</td>
                    <td>${entry.product}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        function sortResultTable(columnIndex) {
            const table = document.getElementById('resultTable');
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));

            if (rows.length === 0) return;

            const isAscending = currentResultSort.column === columnIndex ? !currentResultSort.ascending : true;
            currentResultSort = { column: columnIndex, ascending: isAscending };

            updateSortIcons('resultTable', columnIndex, isAscending);

            rows.sort((a, b) => {
                const cellA = a.cells[columnIndex].textContent.trim();
                const cellB = b.cells[columnIndex].textContent.trim();

                if (columnIndex === 0) {
                    const numA = parseInt(cellA) || 0;
                    const numB = parseInt(cellB) || 0;
                    return isAscending ? numA - numB : numB - numA;
                } else {
                    return isAscending ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
                }
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        function sortDatabaseTable(columnIndex) {
            const table = document.getElementById('databaseTable');
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));

            const isAscending = currentDatabaseSort.column === columnIndex ? !currentDatabaseSort.ascending : true;
            currentDatabaseSort = { column: columnIndex, ascending: isAscending };

            updateSortIcons('databaseTable', columnIndex, isAscending);

            rows.sort((a, b) => {
                const cellA = a.cells[columnIndex].textContent.trim();
                const cellB = b.cells[columnIndex].textContent.trim();

                if (columnIndex === 0) {
                    const [startA] = cellA.split('-').map(Number);
                    const [startB] = cellB.split('-').map(Number);
                    return isAscending ? startA - startB : startB - startA;
                } else {
                    return isAscending ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
                }
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        function updateSortIcons(tableId, activeColumn, isAscending) {
            const table = document.getElementById(tableId);
            const headers = table.querySelectorAll('th .sort-icon');

            headers.forEach((icon, index) => {
                icon.classList.remove('active');
                if (index === activeColumn) {
                    icon.classList.add('active');
                    icon.textContent = isAscending ? '↑' : '↓';
                } else {
                    icon.textContent = '↕';
                }
            });
        }

        window.onload = fetchSerialData;

        document.getElementById('serialInput').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                processSerialNumbers();
            }
        });

        function generateJsonEntries() {
            const productInput = document.getElementById('generatorProductNumber');
            const serialInput = document.getElementById('generatorSerialRanges');
            const output = document.getElementById('generatedJson');

            const productNumber = productInput.value.trim();
            let rawSerialData = serialInput.value.trim();

            clearGeneratorMessage();
            clearGeneratorConflicts();

            const embeddedProductMatch = rawSerialData.match(
                /(?:^|\n)\s*for\s*:\s*([^\r\n]+)\s*/i
            );

            let resolvedProductNumber = productNumber;

            if (!resolvedProductNumber && embeddedProductMatch) {
                resolvedProductNumber = embeddedProductMatch[1].trim();
                productInput.value = resolvedProductNumber;
            }

            if (!resolvedProductNumber) {
                showGeneratorMessage(
                    'Enter a product number, for example A80-00L-RD6-01AU.',
                    'error'
                );
                productInput.focus();
                return;
            }

            rawSerialData = rawSerialData.replace(
                /(?:^|\n)\s*for\s*:\s*[^\r\n]+\s*/gi,
                '\n'
            );

            const serialEntries = parseSerialEntries(rawSerialData);

            if (serialEntries.length === 0) {
                showGeneratorMessage(
                    'No valid serial numbers or ranges were found.',
                    'error'
                );
                serialInput.focus();
                return;
            }

            const conflicts = findExistingSerialConflicts(serialEntries);

            if (conflicts.length > 0) {
                showGeneratorConflicts(conflicts);
                showGeneratorMessage(
                    `${conflicts.length.toLocaleString()} serial entr${conflicts.length === 1 ? 'y' : 'ies'} already exist in the database. Generation blocked.`,
                    'error'
                );
                output.value = '';
                return;
            }

            const jsonObject = {};

            for (const serialEntry of serialEntries) {
                jsonObject[serialEntry] = resolvedProductNumber;
            }

            output.value = JSON.stringify(jsonObject, null, 2);

            const duplicateCount =
                countRawSerialEntries(rawSerialData) - serialEntries.length;

            let message = `Generated ${serialEntries.length.toLocaleString()} JSON entries.`;

            if (duplicateCount > 0) {
                message += ` Removed ${duplicateCount.toLocaleString()} duplicate entries.`;
            }

            showGeneratorMessage(message, 'success');
        }

        function toComparableSerial(value) {
            const normalized = String(value).replace(/^0+/, '') || '0';

            if (!/^\d+$/.test(normalized)) {
                return null;
            }

            return BigInt(normalized);
        }

        function getSerialBounds(entry) {
            if (entry.includes('-')) {
                const [startRaw, endRaw] = entry.split('-');
                const start = toComparableSerial(startRaw);
                const end = toComparableSerial(endRaw);

                if (start === null || end === null) {
                    return null;
                }

                return {
                    start,
                    end,
                    label: entry
                };
            }

            const value = toComparableSerial(entry);

            if (value === null) {
                return null;
            }

            return {
                start: value,
                end: value,
                label: entry
            };
        }

        function serialBoundsOverlap(a, b) {
            return a.start <= b.end && b.start <= a.end;
        }

        function findExistingSerialConflicts(serialEntries) {
            const existingEntries = Object.entries(serialMapping)
                .map(([key, product]) => {
                    const bounds = getSerialBounds(key);
                    return bounds ? { bounds, product } : null;
                })
                .filter(Boolean);

            const conflicts = [];

            for (const entry of serialEntries) {
                const inputBounds = getSerialBounds(entry);

                if (!inputBounds) {
                    continue;
                }

                for (const existing of existingEntries) {
                    if (serialBoundsOverlap(inputBounds, existing.bounds)) {
                        conflicts.push({
                            input: entry,
                            existing: existing.bounds.label,
                            product: existing.product
                        });
                        break;
                    }
                }
            }

            return conflicts;
        }

        function showGeneratorConflicts(conflicts) {
            const conflictsElement = document.getElementById('generatorConflicts');
            const items = conflicts
                .slice(0, 50)
                .map(conflict =>
                    `<li><code>${conflict.input}</code> overlaps <code>${conflict.existing}</code> (${conflict.product})</li>`
                )
                .join('');

            const extra = conflicts.length > 50
                ? `<li>…and ${(conflicts.length - 50).toLocaleString()} more</li>`
                : '';

            conflictsElement.innerHTML = `<strong>Already in database:</strong><ul>${items}${extra}</ul>`;
            conflictsElement.classList.add('show');
        }

        function clearGeneratorConflicts() {
            const conflictsElement = document.getElementById('generatorConflicts');
            conflictsElement.innerHTML = '';
            conflictsElement.classList.remove('show');
        }

        function parseSerialEntries(rawInput) {
            const matches = rawInput.match(/\b\d+(?:\s*-\s*\d+)?\b/g) || [];

            const normalizedEntries = matches
                .map(entry => entry.replace(/\s+/g, ''))
                .filter(isValidSerialEntry);

            return [...new Set(normalizedEntries)];
        }

        function isValidSerialEntry(entry) {
            if (/^\d+$/.test(entry)) {
                return true;
            }

            const rangeMatch = entry.match(/^(\d+)-(\d+)$/);

            if (!rangeMatch) {
                return false;
            }

            try {
                const start = BigInt(rangeMatch[1]);
                const end = BigInt(rangeMatch[2]);

                return end >= start;
            } catch {
                return false;
            }
        }

        function countRawSerialEntries(rawInput) {
            const matches = rawInput.match(/\b\d+(?:\s*-\s*\d+)?\b/g) || [];

            return matches
                .map(entry => entry.replace(/\s+/g, ''))
                .filter(isValidSerialEntry)
                .length;
        }

        async function copyGeneratedJson() {
            const output = document.getElementById('generatedJson');
            const json = output.value.trim();

            clearGeneratorMessage();

            if (!json) {
                showGeneratorMessage(
                    'Generate the JSON before copying it.',
                    'error'
                );
                return;
            }

            try {
                await navigator.clipboard.writeText(json);

                showGeneratorMessage(
                    'Generated JSON copied to the clipboard.',
                    'success'
                );
            } catch (error) {
                output.removeAttribute('readonly');
                output.select();
                output.setSelectionRange(0, output.value.length);

                const copied = document.execCommand('copy');

                output.setAttribute('readonly', '');

                if (copied) {
                    showGeneratorMessage(
                        'Generated JSON copied to the clipboard.',
                        'success'
                    );
                } else {
                    showGeneratorMessage(
                        'Clipboard access failed. Select and copy the output manually.',
                        'error'
                    );
                }

                console.error('Clipboard error:', error);
            }
        }

        function downloadGeneratedJson() {
            const output = document.getElementById('generatedJson');
            const json = output.value.trim();

            clearGeneratorMessage();

            if (!json) {
                showGeneratorMessage(
                    'Generate the JSON before downloading it.',
                    'error'
                );
                return;
            }

            try {
                JSON.parse(json);

                const productNumber =
                    document.getElementById('generatorProductNumber').value.trim();

                const safeProductNumber = productNumber
                    .replace(/[^a-zA-Z0-9_-]+/g, '_')
                    .replace(/^_+|_+$/g, '');

                const filename = safeProductNumber
                    ? `${safeProductNumber}_serials.json`
                    : 'serial_entries.json';

                downloadFile(
                    json,
                    filename,
                    'application/json;charset=utf-8'
                );

                showGeneratorMessage(
                    `Downloaded ${filename}.`,
                    'success'
                );
            } catch (error) {
                console.error('Invalid generated JSON:', error);

                showGeneratorMessage(
                    'The generated output is not valid JSON.',
                    'error'
                );
            }
        }

        function clearJsonGenerator() {
            document.getElementById('generatorProductNumber').value = '';
            document.getElementById('generatorSerialRanges').value = '';
            document.getElementById('generatedJson').value = '';

            clearGeneratorMessage();
            clearGeneratorConflicts();
        }

        function showGeneratorMessage(message, type) {
            const messageElement = document.getElementById('generatorMessage');

            messageElement.textContent = message;
            messageElement.className = `generator-message ${type}`;
        }

        function clearGeneratorMessage() {
            const messageElement = document.getElementById('generatorMessage');

            messageElement.textContent = '';
            messageElement.className = 'generator-message';
        }
    </script>
